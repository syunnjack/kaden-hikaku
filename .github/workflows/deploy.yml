name: Deploy to Xserver

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to Xserver via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SSH_USERNAME }}
          server: ${{ secrets.SSH_HOST }}
          port: 10022
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          local_path: './public/*'
          remote_path: '/home/xs501620/kaden-hikaku.jp/public_html/'
          sftp_only: true
          delete_remote_files: false

      # public/ しか送っていなかったため、blade を直しても本番に届かなかった。
      # サーバ上では public_html が app/public へのシンボリックリンクで、
      # Laravel 本体は <ドメイン>/app/ に置かれている。
      #   ~/kaden-hikaku.jp/app/            リポジトリのルート相当
      #   ~/kaden-hikaku.jp/public_html  -> app/public
      #
      # 消す操作は一切しない。
      #
      # resources/ だけを送っていた時期があり、コントローラを直しても本番に
      # 届かず「デプロイ成功なのに変わらない」状態になった。そこで app/ と
      # routes/ も送る。
      # config/ は送っていない。値は .env から読んでいるので通常は変わらず、
      # 変えたときは手で反映する。
      # .env と storage/ も送らない（サーバ側の値を上書きしないため）。
      - name: Deploy views to Xserver via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SSH_USERNAME }}
          server: ${{ secrets.SSH_HOST }}
          port: 10022
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          local_path: './resources/*'
          remote_path: '/home/xs501620/kaden-hikaku.jp/app/resources/'
          sftp_only: true
          delete_remote_files: false

      - name: Deploy app/ to Xserver via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SSH_USERNAME }}
          server: ${{ secrets.SSH_HOST }}
          port: 10022
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          local_path: './app/*'
          remote_path: '/home/xs501620/kaden-hikaku.jp/app/app/'
          sftp_only: true
          delete_remote_files: false

      - name: Deploy routes/ to Xserver via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SSH_USERNAME }}
          server: ${{ secrets.SSH_HOST }}
          port: 10022
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          local_path: './routes/*'
          remote_path: '/home/xs501620/kaden-hikaku.jp/app/routes/'
          sftp_only: true
          delete_remote_files: false
